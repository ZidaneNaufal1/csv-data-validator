name: Bug report
description: Report reproducible validation behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Use generated CSV fixtures. Never attach customer or personal data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.13
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: Minimal schema and generated CSV fixture
      description: Replace all real records with synthetic values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: The report contains generated data only and no personal information.
          required: true
